name: Release Obsidian plugin

# Actions 列表标题只显示版本号（tag 名），不显示触发它的提交信息——
# 发布提交的信息可以很长，但列表里只需一眼认出是哪个版本。
run-name: ${{ github.ref_name }}

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: 'npm'

            # 两条护栏都在装依赖前硬失败（攒在一步里是为了「一个红色步骤 = 一眼看清是元数据问题」）：
            # ① Obsidian 按 tag 解析更新，tag 与 manifest.json 版本不一致会发布出错误版本；
            # ② 发布说明是 Release 正文的来源（docs/release-notes-<tag>.md）——此前缺失时
            #    静默回退 GitHub 自动生成的提交列表（与 docs/agents/process.md 发布第 4 条
            #    「新增版本补发布说明」不一致），2026-10-13 起改为硬失败。
            - name: Verify tag, manifest version and release notes
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  version="$(node -p "require('./manifest.json').version")"
                  if [ "$tag" != "$version" ]; then
                    echo "::error::Tag '$tag' does not match manifest.json version '$version'. Obsidian resolves updates by tag; mismatched tags publish the wrong version."
                    exit 1
                  fi
                  notes_file="docs/release-notes-${tag}.md"
                  if [ ! -f "$notes_file" ]; then
                    echo "::error::Missing $notes_file. Every release ships a bilingual release-notes file (see docs/agents/process.md, release step 4); without it the Release body silently falls back to auto-generated notes."
                    exit 1
                  fi

            - name: Install dependencies
              run: npm ci

            # 发布门禁：tag push **不会**触发 lint.yml（其 on.push 只匹配 branches，
            # 不匹配 tag），故这里必须自证——测试、lint 与社区目录对照全绿才允许
            # 进入构建与发布。官方 obsidian-workflows 的 release 模式同样在 tag 上
            # 强制跑 scanner 校验：本仓库以自有脚本等价承接（check:release 覆盖
            # manifest/versions/README 面）＋**对照通道**（lint:scanner——用 scanner
            # 的固定版本集与其规则面实跑，定位与边界见 scripts/scanner-lint.mjs
            # 文件头；本地配置已实测 ⊇ scanner 面，见 AGENTS K81）。
            - name: Verify release metadata, tests and lint
              run: |
                  npm run check:release
                  npm test
                  npm run lint
                  npm run lint:css
                  npm run lint:scanner
                  # 2026-10-13 补：本地校验链与 lint.yml 都有这一步，tag 路径此前独缺
                  #（「本地绿」不能替代「发布路径自证」，见上方 tag 不触发 lint.yml 的说明）
                  npm run check:dead-code

            - name: Build plugin
              run: npm run build

            # styles.css 是可选的，用输出变量透传给后续步骤（避免把不存在的路径
            # 传给 gh release create 或 attest 而报错）
            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  # 发布说明必存在：上一道 tag 门禁已硬校验，故这里不再有 --generate-notes
                  # 回落分支（2026-10-13 收敛；此前的回落会让「忘了写发布说明」无痕通过）
                  notes_file="docs/release-notes-${tag}.md"

                  # LICENSE 与 THIRD-PARTY-NOTICES.md 必须随产物分发：
                  # main.js 中约 72% 是 vendored 的 MIT/BSD 代码，且经 bundle + minify
                  # 后逐库版权/许可声明不可见（实测仅存 1 段 svg.js 横幅，其余依赖
                  # 均无内联声明——见 vendor/THIRD-PARTY-NOTICES.md §3），而 MIT 与
                  # BSD 都要求「声明随所有副本或实质性部分一起分发」（BSD-3 明确指向
                  # 「随分发提供的文档和/或其他材料」，即 THIRD-PARTY-NOTICES.md）。
                  # 这两个文件此前只在仓库里、不在发布资产中。
                  # 注：Obsidian 目录解析只读 main.js/manifest.json/styles.css，
                  # 多带这两个文件不影响目录校验。
                  gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    --notes-file "$notes_file" \
                    main.js manifest.json \
                    LICENSE vendor/THIRD-PARTY-NOTICES.md \
                    ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
