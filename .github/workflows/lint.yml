name: Node.js build

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                # Node 20 已于 2026-04 结束安全维护，不再纳入矩阵
                node-version: [22.x, 24.x]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
            - run: npm ci
            - run: npm run build --if-present
            - run: npm test -- --reporter=verbose --bail=1
            # 覆盖率报告（html/lcov 产物随 workflow 归档，文本摘要进日志；
            # 仅在主矩阵版本执行一次，避免三倍上传）
            - name: Test coverage
              if: matrix.node-version == '24.x'
              run: npm run test:coverage
            - name: Upload coverage report
              if: matrix.node-version == '24.x'
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-report
                  path: coverage/
                  retention-days: 14
            - run: npm run lint
            # 引擎运行时渲染契约（无头 Chrome）：单测覆盖不到「DOM 装配/视口几何」
            # 这类行为；ubuntu-latest 自带 google-chrome，--require-chrome 保证
            # 浏览器缺失时直接失败而不是静默跳过。仅主矩阵版本执行一次。
            # 输出重定向到文件（Node 对文件句柄是同步写，进程被信号杀死也不丢日志），
            # 失败时把尾部转成 ::error:: 注解——check annotation 无需登录即可通过
            # REST API 读取，便于在无 Actions 日志权限时定位失败原因。
            - name: Visual rendering contract
              if: matrix.node-version == '24.x'
              run: |
                  set +e
                  npm run verify:visual -- --require-chrome > /tmp/verify-visual.log 2>&1
                  status=$?
                  cat /tmp/verify-visual.log
                  if [ $status -ne 0 ]; then
                    tail -n 40 /tmp/verify-visual.log | while IFS= read -r line; do
                      echo "::error::visual: ${line}"
                    done
                    echo "::error::visual exit=${status}"
                    exit 1
                  fi
